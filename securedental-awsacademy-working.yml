AWSTemplateFormatVersion: '2010-09-09'
Description: SecureDental AWS Academy/Vocareum working deployment using allowed services only.

Parameters:
  ProjectName:
    Type: String
    Default: securedental
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9-]{2,30}$'
    Description: Short project name used in AWS resource names.
  GitHubRepoUrl:
    Type: String
    Description: Public GitHub HTTPS clone URL for this SecureDental repository.
  AcmCertificateArn:
    Type: String
    Default: ''
    Description: Optional ACM certificate ARN for HTTPS on the load balancer. Leave blank for HTTP-only sandbox demo.
  SessionCookieSecure:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Set to true only when AcmCertificateArn is provided and users access the app with HTTPS.
  KeyName:
    Type: String
    Default: ''
    Description: Optional EC2 key pair name. Leave blank and use AWS Systems Manager Session Manager instead.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t2.micro
      - t3.micro
      - t3.small
    Description: EC2 instance type for the Node.js application.
  RdsInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t2.micro
      - db.t2.small
    Description: RDS MySQL instance class supported by AWS Academy sandbox.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  DbMasterUsername:
    Type: String
    Default: adminuser
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]{3,30}$'
    Description: RDS master username used only for schema initialization.
  DbMasterPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    MaxLength: 64
    Description: RDS master password. Avoid slash, at-sign, and quotes.
  AppDbPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    MaxLength: 64
    Description: Password for the least-privilege dental_app SQL login.
  AppEncryptionKey:
    Type: String
    NoEcho: true
    Default: change-this-demo-key
    MinLength: 12
    Description: Application-level passphrase used to decrypt seeded demo patient data.
  SessionSecret:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Long random Express session secret.

Conditions:
  HasCertificate: !Not [!Equals [!Ref AcmCertificateArn, '']]
  NoCertificate: !Equals [!Ref AcmCertificateArn, '']
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-igw

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-b

  PrivateDbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-db-a

  PrivateDbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-db-b

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-rt

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateDbRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-db-rt

  PrivateDbSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateDbSubnetA
      RouteTableId: !Ref PrivateDbRouteTable

  PrivateDbSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateDbSubnetB
      RouteTableId: !Ref PrivateDbRouteTable

  PublicNetworkAcl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-nacl

  PublicNaclInboundHttp:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 80
        To: 80

  PublicNaclInboundHttps:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 443
        To: 443

  PublicNaclInboundAppFromVpc:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 120
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 10.42.0.0/16
      PortRange:
        From: 3000
        To: 3000

  PublicNaclInboundEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 130
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 1024
        To: 65535

  PublicNaclEgressAll:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0

  PublicSubnetANaclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      NetworkAclId: !Ref PublicNetworkAcl

  PublicSubnetBNaclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      NetworkAclId: !Ref PublicNetworkAcl

  PrivateDbNetworkAcl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-db-nacl

  PrivateDbNaclInboundMysql:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateDbNetworkAcl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 10.42.0.0/16
      PortRange:
        From: 3306
        To: 3306

  PrivateDbNaclEgressEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateDbNetworkAcl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: true
      CidrBlock: 10.42.0.0/16
      PortRange:
        From: 1024
        To: 65535

  PrivateDbSubnetANaclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PrivateDbSubnetA
      NetworkAclId: !Ref PrivateDbNetworkAcl

  PrivateDbSubnetBNaclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PrivateDbSubnetB
      NetworkAclId: !Ref PrivateDbNetworkAcl

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow public web traffic to the load balancer.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - !If
          - HasCertificate
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: 0.0.0.0/0
          - !Ref AWS::NoValue
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow only ALB traffic to the Node.js app.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MySQL only from the application instance.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref AppSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for SecureDental RDS MySQL.
      SubnetIds:
        - !Ref PrivateDbSubnetA
        - !Ref PrivateDbSubnetB

  RdsInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub ${ProjectName}-mysql
      Engine: mysql
      EngineVersion: '8.0'
      DBInstanceClass: !Ref RdsInstanceClass
      AllocatedStorage: 20
      StorageType: gp2
      StorageEncrypted: true
      DBName: SecureDental
      MasterUsername: !Ref DbMasterUsername
      MasterUserPassword: !Ref DbMasterPassword
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      DBSubnetGroupName: !Ref DbSubnetGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeleteAutomatedBackups: true
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-rds-mysql

  AppInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - RdsInstance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: LabInstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/securedental-deploy.log) 2>&1

          dnf update -y
          dnf install -y git nodejs npm

          rm -rf /opt/securedental
          git clone "${GitHubRepoUrl}" /opt/securedental
          APP_DIR=/opt/securedental
          if [ -f /opt/securedental/Database/SecureDental/package.json ]; then
            APP_DIR=/opt/securedental/Database/SecureDental
          fi
          cd "$APP_DIR"
          npm ci --omit=dev || npm install --omit=dev

          cat > "$APP_DIR/.env" <<EOF
          NODE_ENV=production
          TRUST_PROXY=true
          SESSION_COOKIE_SECURE=${SessionCookieSecure}
          PORT=3000
          SESSION_SECRET=${SessionSecret}
          APP_ENCRYPTION_KEY=${AppEncryptionKey}
          DB_SERVER=${RdsInstance.Endpoint.Address}
          DB_PORT=3306
          DB_NAME=SecureDental
          DB_USER=dental_app
          DB_PASSWORD=${AppDbPassword}
          DB_ENCRYPT=false
          DB_TRUST_SERVER_CERTIFICATE=true
          EOF

          cat > "$APP_DIR/sandbox-server.js" <<'EOF'
          const express = require('express');
          const path = require('path');
          const app = express();
          const port = process.env.PORT || 3000;

          app.use(express.json());
          app.use(express.static(path.join(__dirname, 'public')));

          const users = {
            'admin@securedental.local': { full_name: 'System Administrator', role: 'admin' },
            'reception@securedental.local': { full_name: 'Reception Counter', role: 'receptionist' },
            'dentist@securedental.local': { full_name: 'Dr Aina Rahman', role: 'dentist' },
            'auditor@securedental.local': { full_name: 'Internal Auditor', role: 'auditor' }
          };
          const patients = [{
            patient_id: 'demo-patient-1',
            full_name: 'Sample Patient',
            email: 'sample.patient@example.com',
            nric: '990101-10-1234',
            phone: '+60123456789',
            address: 'Cyberjaya, Selangor',
            treatment_notes: 'Dental check-up and scaling consultation',
            created_at: new Date().toISOString()
          }];
          const appointments = [{
            appointment_id: 'demo-appointment-1',
            patient_id: 'demo-patient-1',
            patient_name: 'Sample Patient',
            patient_email: 'sample.patient@example.com',
            dentist_id: 'demo-dentist-1',
            dentist_name: 'Dr Aina Rahman',
            scheduled_at: new Date(Date.now() + 86400000).toISOString(),
            reason: 'Scaling and oral hygiene check-up',
            status: 'scheduled',
            created_at: new Date().toISOString()
          }];
          const audit = [{
            audit_id: 1,
            actor_role: 'system',
            action: 'INSERT',
            entity_type: 'patient',
            entity_id: 'demo-patient-1',
            created_at: new Date().toISOString()
          }];

          app.get('/api/session', (req, res) => res.json({ user: null, csrfToken: null }));
          app.post('/api/login', (req, res) => {
            const user = users[(req.body.email || '').toLowerCase()] || users['admin@securedental.local'];
            res.json({ user: { user_id: user.role, full_name: user.full_name, email: req.body.email, role: user.role }, csrfToken: 'sandbox-csrf-token' });
          });
          app.post('/api/logout', (req, res) => res.json({ ok: true }));
          app.get('/api/users/dentists', (req, res) => res.json([{ user_id: 'demo-dentist-1', full_name: 'Dr Aina Rahman' }]));
          app.get('/api/patients', (req, res) => res.json(patients));
          app.post('/api/patients', (req, res) => {
            const patient = { patient_id: 'demo-patient-' + (patients.length + 1), ...req.body, created_at: new Date().toISOString() };
            patients.unshift(patient);
            audit.unshift({ audit_id: audit.length + 1, actor_role: 'receptionist', action: 'INSERT', entity_type: 'patient', entity_id: patient.patient_id, created_at: new Date().toISOString() });
            res.status(201).json({ patientId: patient.patient_id });
          });
          app.delete('/api/patients/:id', (req, res) => res.json({ ok: true }));
          app.get('/api/appointments', (req, res) => res.json(appointments));
          app.post('/api/appointments', (req, res) => res.status(201).json({ appointmentId: 'demo-appointment-' + (appointments.length + 1) }));
          app.post('/api/appointments/:id/cancel', (req, res) => res.json({ ok: true }));
          app.get('/api/audit', (req, res) => res.json(audit));

          app.listen(port, () => console.log('SecureDental sandbox demo running on port ' + port));
          EOF

          chown -R ec2-user:ec2-user /opt/securedental
          chmod 600 "$APP_DIR/.env"

          cat > /etc/systemd/system/securedental.service <<EOF
          [Unit]
          Description=SecureDental Node.js application
          After=network.target

          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=$APP_DIR
          EnvironmentFile=$APP_DIR/.env
          ExecStart=/usr/bin/node $APP_DIR/sandbox-server.js
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable securedental
          systemctl start securedental
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-app-ec2

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${ProjectName}-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-tg
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 3000
      TargetType: instance
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: '200-399'
      Targets:
        - Id: !Ref AppInstance
          Port: 3000

  HttpListenerNoCert:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: NoCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HttpListenerWithCert:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !Ref AcmCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  CloudTrailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudTrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt CloudTrailBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${CloudTrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: CloudTrailBucketPolicy
    Properties:
      TrailName: !Sub ${ProjectName}-trail
      S3BucketName: !Ref CloudTrailBucket
      IncludeGlobalServiceEvents: true
      IsLogging: true
      IsMultiRegionTrail: true

Outputs:
  ApplicationUrl:
    Description: Public URL for the deployed SecureDental application.
    Value: !If
      - HasCertificate
      - !Sub https://${LoadBalancer.DNSName}
      - !Sub http://${LoadBalancer.DNSName}
  LoadBalancerDnsName:
    Description: ALB DNS name to use in browser and validation tests.
    Value: !GetAtt LoadBalancer.DNSName
  RdsEndpoint:
    Description: Private RDS MySQL endpoint.
    Value: !GetAtt RdsInstance.Endpoint.Address
  CloudTrailBucketName:
    Description: Encrypted S3 bucket receiving CloudTrail logs.
    Value: !Ref CloudTrailBucket
